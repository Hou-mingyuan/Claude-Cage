name: Main pull request checks
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: main-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.scope.outputs.platforms }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/pr-files"
          platforms=false
          website=false
          while IFS= read -r -d '' path; do
            case "$path" in
              README*.md|www/*|docs/guide/*|docs/releases/*) ;;
              *) platforms=true ;;
            esac
            case "$path" in
              README*.md|www/*|assets/*|docs/guide/*|scripts/agent-*.mjs|scripts/verify-macos-release.sh|.github/workflows/www.yml|.github/actions/build-website/*|.github/workflows/pr-checks.yml) website=true ;;
            esac
          done < "$RUNNER_TEMP/pr-files"
          printf 'platforms=%s\nwebsite=%s\n' "$platforms" "$website" >> "$GITHUB_OUTPUT"
  platforms:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    uses: ./.github/workflows/ci.yml
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-website
  merge-check:
    name: Main PR CI
    needs: [changes, platforms, website]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          PLATFORMS: ${{ needs.platforms.result }}
          WEBSITE: ${{ needs.website.result }}
          NEED_PLATFORMS: ${{ needs.changes.outputs.platforms }}
          NEED_WEBSITE: ${{ needs.changes.outputs.website }}
        run: |
          check() {
            [[ "$1:$2" == true:success || "$1:$2" == false:skipped ]]
          }
          [[ "$CHANGES" == success ]]
          check "$NEED_PLATFORMS" "$PLATFORMS"
          check "$NEED_WEBSITE" "$WEBSITE"
